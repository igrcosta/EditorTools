services:
  - type: web
    name: editools
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: MAX_FILESIZE
        value: 2G
      - key: MAX_DURATION_SECONDS
        value: '7200'
      - key: MAX_CONCURRENT_JOBS
        value: '1'
      # Image tools + face tracking need the desktop app (GPU / memory).
      - key: IMAGE_TOOLS
        value: 'false'
      # Automatic Captions (whisper.cpp) needs the desktop app (CPU/memory headroom the free tier lacks).
      - key: CAPTIONS_TOOL
        value: 'false'
