# Render blueprint: only the sales landing page is hosted (a free Static Site: always on, nothing to wake up).
# The desktop app and its server are never deployed. The three VITE_* values are public by nature
# (they end up in the page); set them in the Render dashboard after creating the service.
services:
  - type: web
    name: editools-landing
    runtime: static
    buildCommand: npm ci --ignore-scripts && npm run build -w @editools/landing
    staticPublishPath: apps/landing/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_DOWNLOAD_URL
        sync: false
      - key: VITE_CHECKOUT_URL
        sync: false
      - key: VITE_SUPPORT_EMAIL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
