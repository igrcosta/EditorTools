<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#09090b;font-family:Arial,Helvetica,sans-serif;color:#e4e4e7;">
    <div style="max-width:420px;margin:0 auto;padding:28px;border:1px solid #27272a;border-radius:14px;background:#131519;">
      <p style="margin:0 0 6px;font-size:13px;letter-spacing:.14em;color:#b083ff;">EDITOOLS</p>
      <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff;">Seu código de acesso</h1>
      <p style="margin:0 0 20px;font-size:14px;line-height:1.5;color:#a1a1aa;">
        Digite este código no Editools para entrar. Ele vale por 1 hora e só pode ser usado uma vez.
      </p>
      <p style="margin:0 0 20px;padding:14px;text-align:center;font-size:32px;font-weight:700;letter-spacing:.35em;color:#ffffff;background:#09090b;border-radius:10px;">
        {{ .Token }}
      </p>
      <p style="margin:0;font-size:12px;line-height:1.5;color:#71717a;">
        Your Editools sign-in code. Enter it in the app; it is valid for 1 hour and works once.<br />
        Se você não pediu este código, ignore este e-mail.
      </p>
    </div>
  </body>
</html>
