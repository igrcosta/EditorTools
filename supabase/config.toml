# Supabase local development config (`supabase start`). Written by hand, NOT generated by
# `supabase init`: if your CLI version complains about a key, run `supabase init` in a scratch
# folder and copy over only the values that differ.

project_id = "editools"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Catches the sign-in e-mails locally (http://127.0.0.1:54324), so the login-code flow can be tested
# without sending real mail.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
# Passwordless: the app asks for a 6-digit code sent by e-mail.
otp_length = 6
otp_expiry = 3600

# Both templates must contain {{ .Token }}: a brand-new address is sent the "confirmation" template,
# an existing one the "magic_link" template. With the default templates the user would get a link
# (which this desktop flow cannot use) instead of a code. In a hosted project, paste the same HTML
# into Authentication > Email Templates.
[auth.email.template.confirmation]
subject = "Seu código do Editools / Your Editools code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "Seu código do Editools / Your Editools code"
content_path = "./supabase/templates/otp.html"

# Edge Functions. Both require the caller's JWT.
[functions.get-entitlements]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Kiwify cannot send a Supabase JWT; the request is authenticated by its HMAC signature instead.
[functions.kiwify-webhook]
verify_jwt = false
